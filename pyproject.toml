[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undrr-fonte-starter"
version = "0.1.0"
description = "UNDRR FONTE extraction and polygon-resolution prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.0",
    "databricks-sql-connector[pyarrow]>=4.0.0",
    "folium>=0.17",
    "geopandas>=0.14",
    "mapclassify>=2.6",
    "matplotlib>=3.8",
    "openai>=2.30.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pycountry>=23.12",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.6",
    "requests>=2.31",
    "scipy>=1.10",
    "shapely>=2.0",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The NER benchmark baseline (benchmark_ner/). Kept out of the main dependency
# set so the extraction pipeline does not carry a model runtime it never uses.
# The `en_core_web_lg` model is not on PyPI: `python -m spacy download en_core_web_lg`.
ner = [
    "spacy>=3.8",
]

[project.scripts]
fonte-extract = "fonte.app_event_focus:main"
fonte-polygons = "fonte.run_polygon_resolution:main"
fonte-upload = "fonte.upload_outputs:main"

[tool.setuptools.packages.find]
where = ["src"]
